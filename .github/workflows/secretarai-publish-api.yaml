name: Publish Secretar AI API image

on:
  push:
    branches:
      - 'release/v*-secretarai.*'
    paths:
      - '.github/workflows/secretarai-publish-api.yaml'

permissions:
  contents: write
  packages: write

concurrency:
  group: secretarai-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Secretar-AI/openreplay'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IMAGE: ghcr.io/secretar-ai/openreplay/api
    steps:
      - name: Download the image validated on the build VM
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#release/}"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-secretarai\.[0-9]+$ ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir release-input
          gh release download "$version" --dir release-input
          cd release-input
          sha256sum --check SHA256SUMS
          jq -e '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length == 0' trivy-api.json
          docker load --input "openreplay-api-$version.tar.gz"
          source_image="secretarai-openreplay-api:$version"
          expected_id=$(jq -r .imageId release-metadata.json)
          expected_revision=$(jq -r .sourceCommit release-metadata.json)
          [[ "$(docker image inspect "$source_image" --format '{{.Id}}')" == "$expected_id" ]]
          [[ "$(docker image inspect "$source_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "$expected_revision" ]]
          [[ "$(docker image inspect "$source_image" --format '{{.Os}}/{{.Architecture}}')" == "$(jq -r .platform release-metadata.json)" ]]
          docker tag "$source_image" "$IMAGE:$version"

      - name: Log in to the fork's container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish the verified image and deployment references
        shell: bash
        run: |
          set -euo pipefail
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release image $IMAGE:$VERSION" >&2
            exit 1
          fi
          docker push "$IMAGE:$VERSION"
          reference=$(docker image inspect "$IMAGE:$VERSION" --format '{{index .RepoDigests 0}}')
          [[ "$reference" == "$IMAGE@sha256:"* ]]
          printf '%s\n' "$reference" > image-reference.txt
          cat > helm-api-override.yaml <<EOF
          api:
            image:
              registry: ghcr.io/secretar-ai
              repository: openreplay/api
              tag: "$VERSION"
          EOF
          gh release upload "$VERSION" image-reference.txt helm-api-override.yaml
          {
            echo "### Secretar AI API image"
            echo "Image: \`$IMAGE:$VERSION\`"
            echo "Digest reference: \`$reference\`"
          } >> "$GITHUB_STEP_SUMMARY"
